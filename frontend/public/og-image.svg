<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#grad)"/>
  
  <!-- Book icon -->
  <rect x="100" y="200" width="200" height="280" fill="#ffffff" opacity="0.1" rx="10"/>
  <rect x="100" y="200" width="30" height="280" fill="#ffffff" opacity="0.2" rx="5"/>
  
  <!-- Text -->
  <text x="400" y="280" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#ffffff">
    BookDigest
  </text>
  <text x="400" y="360" font-family="Arial, sans-serif" font-size="36" fill="#e0e7ff">
    454+ AI-Powered Book Summaries
  </text>
  <text x="400" y="420" font-family="Arial, sans-serif" font-size="28" fill="#bfdbfe">
    Learn from the best books in 15 minutes
  </text>
</svg>
